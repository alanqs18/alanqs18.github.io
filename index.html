<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="alanqs18’s personal project page for web tools and AI-assisted development.">
  <meta name="theme-color" content="#f6f4ed">
  <title>alanqs18 — Independent web projects</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #182923;
      background: #f6f4ed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      align-items: center;
      padding: clamp(1.25rem, 6vw, 5rem);
    }

    main {
      width: min(100%, 54rem);
      margin-inline: auto;
      padding: clamp(1.5rem, 6vw, 4.75rem);
      border: 1px solid #cbcfc3;
      border-top: 5px solid #2c5946;
      border-radius: 0 0 1.25rem 1.25rem;
      background: #fffdf8;
    }

    .account {
      margin: 0 0 1.35rem;
      color: #2c5946;
      font-size: 0.95rem;
      font-weight: 650;
    }

    h1 {
      max-width: 15ch;
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 400;
      line-height: 1.03;
      letter-spacing: -0.045em;
    }

    .intro {
      max-width: 39rem;
      margin: 1.55rem 0 0;
      color: #3c4a42;
      font-size: clamp(1.025rem, 2vw, 1.2rem);
      line-height: 1.65;
    }

    .intro[lang] { margin-top: 0.8rem; }

    .profile {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.7rem 1.1rem;
      border-radius: 0.4rem;
      background: #254b3b;
      color: #fffdf8;
      font-weight: 600;
      line-height: 1.5;
      text-decoration: none;
    }

    .profile:hover { background: #182923; }

    .profile:focus-visible {
      outline: 2px solid #254b3b;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <p class="account">alanqs18</p>
    <h1>Independent web projects</h1>
    <p class="intro">I build small web tools and explore how AI can help turn ideas into usable software, from prototyping to deployment.</p>
    <p class="intro" lang="zh-CN">我在开发轻量的网页工具，也在探索如何借助 AI，把想法从原型做成可以实际使用的软件。</p>
    <a class="profile" href="https://github.com/alanqs18">GitHub profile <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
